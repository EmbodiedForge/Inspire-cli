name: Public CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.4'
          python-version: '3.12'
      - run: uv lock --check
      - run: uv run --frozen ruff check .
      - run: uv run --frozen black --check .
      - run: git ls-files -z | xargs -0 -r uv run --frozen python scripts/check_secrets.py
      - run: uv run --frozen pytest -q
      - name: Build and verify wheel
        run: |
          uv build --wheel
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          uvx --from "$wheel" inspire --version
          uv run --frozen python scripts/check_wheel_skills.py "$wheel"
